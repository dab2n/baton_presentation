<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATON 발표자료</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: clip; background: #fff; }
  /* 들어오는 장이 나가는 장 위로 덮이며 페이드 (나가는 장은 .prev 로 끝까지 불투명 유지 → 중간에 흰 바탕이 비치지 않음) */
  .slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .slide.prev { opacity: 1; visibility: visible; z-index: 1; }
  .slide.on { opacity: 1; visibility: visible; z-index: 2; transition: opacity var(--fade, .6s) ease; }
  .prev .a { opacity: 1; }
  .snap, .snap * { transition: none !important; }
  .abs, .slide img, .slide svg.full { position: absolute; display: block; }
  svg.full { left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  svg g, svg path { transform-box: fill-box; }

  /* 등장 모션: .on 이 붙을 때마다 다시 재생 */
  .a { opacity: 0; }
  .on .a { animation: var(--k, up) var(--t, 1s) var(--e, cubic-bezier(.16, 1, .3, 1)) calc(var(--d, 0s) + var(--sd, 0s)) both; }
  @keyframes up   { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(90px); } to { opacity: 1; transform: none; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { opacity: 0; transform: scaleX(.2); } to { opacity: 1; transform: none; } }
  @keyframes walk { from { opacity: 0; transform: translateX(120px); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
  @keyframes walk2 { from { opacity: 0; transform: translateX(50px); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
  @keyframes soft { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes fromleft { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
  @keyframes zoom { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  /* 반지: 한 장 안에서 2단계 (전체 카드 → 그리드) */
  .ease { transition: all 1s cubic-bezier(.65, 0, .35, 1); }
  #ring .card1 { left: 46px; top: 46px; width: 1828px; height: 988px; border-radius: 50px; background: #f2f2f2; }
  #ring .ringimg { left: 570px; top: 78px; width: 780px; height: 923px; transform-origin: 0 0; }
  #ring[data-step="1"] .card1 { width: 908px; }
  #ring[data-step="1"] .ringimg { transform: translate(-446px, 10px) scale(.96411, .96533); }
  .bi { opacity: 0; transform: translateY(40px); transition: opacity .5s, transform .5s; }
  .bi.bx { transform: translateX(160px); }
  #ring[data-step="1"] .bi { opacity: 1; transform: none; transition: opacity .9s var(--d), transform 1.1s cubic-bezier(.16, 1, .3, 1) var(--d); }

  /* 6·7 바톤: 손 이미지 → 반지 영상 dissolve, 빛 번짐이 아래로 */
  #baton { background: #000; }
  #baton .bg { left: 0; top: 0; width: 1920px; height: 1100px; background: #0b0b1b; transition: background 1.6s; }
  #baton .glow { left: -524.4px; top: 0; width: 2969.8px; height: 1792.4px; transition: transform 1.8s cubic-bezier(.65, 0, .35, 1); }
  #baton .noise { left: 0; top: 0; width: 1920px; height: 1100px; background: url(assets/noise.png); }
  #baton .hand { left: 430.8997px; top: -110.8205px; width: 1057.492px; height: 1321.393px; transform: rotate(-2.01deg); -webkit-mask-image: linear-gradient(180deg, transparent, #000 90px); mask-image: linear-gradient(180deg, transparent, #000 90px); }
  /* hand.png 은 피그마의 multiply + 어둡게 처리를 미리 구워둔 것 (브라우저 합성과 무관하게 항상 어둡게) */
  .on .hand { animation: handup 3.2s cubic-bezier(.22, 1, .36, 1) calc(.2s + var(--sd, 0s)) both; }
  @keyframes handup { from { opacity: 0; transform: translateY(85px) rotate(-2.01deg); } to { opacity: 1; transform: rotate(-2.01deg); } }
  #baton .handwrap, #baton .vid { transition: opacity 1.4s ease-in-out; }
  #baton .vid { left: 854px; top: 132px; width: 212px; height: 817px; border-radius: 19px; overflow: hidden; isolation: isolate; opacity: 0; }
  #baton .vid > * { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 19px; }
  #baton .vid video { object-fit: fill; }
  #baton[data-step="1"] .bg { background: #000; }
  #baton[data-step="1"] .glow { transform: translateY(391px); }
  #baton[data-step="1"] .handwrap { opacity: 0; }
  #baton[data-step="1"] .vid { opacity: 1; }

  /* 10·11: 로봇 카드 → Scene 카드 */
  #trio .card { top: 46px; height: 988px; width: 601px; border-radius: 50px; overflow: hidden; background: #f9f9f9; transition: left 1.3s cubic-bezier(.65, 0, .35, 1), width 1.3s cubic-bezier(.65, 0, .35, 1), background .8s; }
  #trio .c1 { left: 46px; --cd: 0s; } #trio .c2 { left: 659px; --cd: .2s; } #trio .c3 { left: 1272px; --cd: .4s; }
  #trio .ri { transition: opacity 1s ease; }
  #trio .si { opacity: 0; transition: opacity 1s ease; }
  #trio .ov { left: -13px; top: 710px; width: 628px; height: 294px; filter: blur(var(--fb)); -webkit-backdrop-filter: blur(var(--bb)); backdrop-filter: blur(var(--bb));
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 103px); mask-image: linear-gradient(180deg, transparent, #000 103px);
    -webkit-mask-size: 100% calc(100% + 103px); mask-size: 100% calc(100% + 103px); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: 0 0; mask-position: 0 0;
    transition: top 1.3s cubic-bezier(.65, 0, .35, 1), height 1.3s cubic-bezier(.65, 0, .35, 1), -webkit-mask-position 1.3s cubic-bezier(.65, 0, .35, 1), mask-position 1.3s cubic-bezier(.65, 0, .35, 1), backdrop-filter 1.3s, -webkit-backdrop-filter 1.3s, filter 1.3s; }
  #trio .ov.b1 { --bb: 20.53px; --fb: 1.78px; } #trio .ov.b2 { --bb: 10.3px; --fb: 0px; }
  #trio .ov.b1 .g { background: linear-gradient(180deg, rgba(255,248,167,0) 2.059%, rgba(255,248,167,.45) 67.981%); }
  #trio .ov.b2 .g { background: linear-gradient(180deg, rgba(255,248,167,0) 5.442%, rgba(255,248,167,.45) 69.087%); }
  #trio .ov .g, #trio .ov .s { position: absolute; inset: 0; transition: opacity 1.3s cubic-bezier(.65, 0, .35, 1); }
  #trio .ov .s { background: rgba(255,246,139,.45); opacity: 0; }
  #trio .bo { transition: opacity .5s, transform .6s; }
  #trio .st { opacity: 0; transform: translateY(26px); filter: blur(8px); transition: opacity .4s, transform .4s, filter .4s; }
  #trio[data-step="1"] .c2 { width: 603px; } #trio[data-step="1"] .c3 { left: 1273px; }
  #trio[data-step="1"] .card { background: #fff; transition-delay: var(--cd), var(--cd), calc(.75s + var(--cd)); }
  #trio[data-step="1"] .ri { opacity: 0; transition-delay: calc(.75s + var(--cd)); }
  #trio[data-step="1"] .si { opacity: 1; transition-delay: calc(.75s + var(--cd)); }
  #trio[data-step="1"] .ov { top: 0; height: 1004px; --bb: 7.35px; --fb: 1.78px; -webkit-mask-position: 0 -103px; mask-position: 0 -103px; transition-delay: var(--cd); }
  #trio[data-step="1"] .ov .g { opacity: 0; transition-delay: var(--cd); } #trio[data-step="1"] .ov .s { opacity: 1; transition-delay: var(--cd); }
  #trio[data-step="1"] .bo { opacity: 0; transform: translateY(-14px); transition-delay: var(--cd); }
  #trio[data-step="1"] .st { opacity: 1; transform: none; filter: none; transition: opacity 1s var(--d), transform 1.3s cubic-bezier(.16, 1, .3, 1) var(--d), filter 1s var(--d); }
  @keyframes photo { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
  @keyframes drawdown { from { opacity: 1; transform: scaleY(0); } to { opacity: 1; transform: none; } }
  /* 9장 하단 푸른 빛: 화면 UI 영상이 시작될 때(.playing) 아래에서 위로 */
  .glowup { opacity: 0; transform: translateY(320px); transition: opacity .3s, transform .3s; }
  .playing .glowup, .static .glowup { opacity: 1; transform: none; transition: opacity 1.2s ease, transform 1.8s cubic-bezier(.16, 1, .3, 1); }
  .after { opacity: 0; transform: translateY(18px); filter: blur(6px); transition: opacity .3s, transform .3s, filter .3s; }
  .done .after, .static .after { opacity: 1; transform: none; filter: none; transition: opacity 1.1s, transform 1.3s cubic-bezier(.16, 1, .3, 1), filter 1.1s; }
  @keyframes blurup { from { opacity: 0; transform: translateY(22px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

  /* ?static : 모션 없이 최종 상태 (피그마 대조용) */
  .static * { animation: none !important; transition: none !important; }
  .static .a { opacity: 1; }
</style>

    <svg class="full" viewBox="0 0 1920 1080" style="--k:rise; --t:1.5s; --d:1.1s"><g class="a"><g transform="translate(64.0547 649.554)"><path d="M57.0049 184.446V33.6968H-0.000938772V3.29366H149.734V33.6968H92.9819V184.446H57.0049ZM165.195 184.446V3.29366H201.426V78.0347H278.7V3.29366H314.677V184.446H278.7V108.184H201.426V184.446H165.195ZM323.218 184.446L388.838 3.29366H437.23L502.597 184.446H463.833L449.138 142.641H376.677L361.982 184.446H323.218ZM386.305 112.998H439.51L412.907 36.4837L386.305 112.998ZM511.096 184.446V3.29366H553.154L632.202 135.547V3.29366H668.432V184.446H624.854L547.326 56.4991V184.446H511.096ZM690.971 184.446V3.29366H727.202V80.5682L797.635 3.29366H841.467L771.793 80.3149L846.027 184.446H803.209L747.47 105.651L727.202 127.44V184.446H690.971ZM953.948 184.446V118.065L888.328 3.29366H929.119L972.19 84.1153L1015.01 3.29366H1055.8L990.179 118.065V184.446H953.948ZM1041.2 93.9963C1041.2 79.4704 1043.31 66.4646 1047.53 54.979C1051.93 43.3244 1058.09 33.4434 1066.03 25.3359C1073.97 17.2284 1083.51 10.9789 1094.66 6.58733C1105.81 2.19577 1118.22 -1.30652e-05 1131.9 -1.30652e-05C1145.58 -1.30652e-05 1158 2.19577 1169.15 6.58733C1180.3 10.81 1189.84 17.0595 1197.78 25.3359C1205.72 33.4434 1211.8 43.3244 1216.02 54.979C1220.24 66.4646 1222.35 79.4704 1222.35 93.9963C1222.35 108.522 1220.24 121.612 1216.02 133.267C1211.8 144.753 1205.72 154.549 1197.78 162.657C1190.01 170.764 1180.46 177.014 1169.15 181.405C1158 185.628 1145.58 187.739 1131.9 187.739C1118.22 187.739 1105.81 185.628 1094.66 181.405C1083.51 177.014 1073.97 170.764 1066.03 162.657C1058.09 154.549 1051.93 144.753 1047.53 133.267C1043.31 121.612 1041.2 108.522 1041.2 93.9963ZM1078.44 93.9963C1078.44 103.793 1079.71 112.66 1082.25 120.599C1084.78 128.538 1088.33 135.209 1092.89 140.614C1097.62 146.019 1103.27 150.158 1109.86 153.029C1116.45 155.9 1123.71 157.336 1131.65 157.336C1139.76 157.336 1147.1 155.9 1153.69 153.029C1160.28 150.158 1165.94 146.019 1170.67 140.614C1175.4 135.209 1179.03 128. <script>
  const q = new URLSearchParams(location.search);
  if (q.has('static')) { document.documentElement.classList.add('static'); addEventListener('DOMContentLoaded', () => document.querySelectorAll('svg animate').forEach(a => { a.parentNode.setAttribute(a.getAttribute('attributeName'), a.parentNode.tagName === 'feDisplacementMap' ? 0 : a.parentNode.getAttribute(a.getAttribute('attributeName'))); a.remove(); })); }

  const stage = document.getElementById('stage');
  const fit = () => {
    if (q.has('static')) return stage.style.cssText = 'left:0; top:0';
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
  };
  addEventListener('resize', fit); fit();

  const slides = [...document.querySelectorAll('.slide')];
  const steps = slides.flatMap((s, i) => Array.from({ length: +s.dataset.steps || 1 }, (_, k) => [i, k]));
  let cur = -1, curSlide = -1, prevTimer;
  function go(n) {
    n = Math.max(0, Math.min(steps.length - 1, n));
    if (n === cur) return;
    const [i, k] = steps[n];
    let wait = 0;
    const entered = i !== curSlide;
    if (entered) {
      const from = slides[curSlide], to = slides[i];
      // 검정↔흰색처럼 대지 밝기가 바뀌면 천천히 바꾸고, 다 바뀐 뒤에 요소가 움직이기 시작
      const swap = !!from && from.hasAttribute('data-dark') !== to.hasAttribute('data-dark');
      const fade = swap ? .9 : .4;
      wait = swap ? fade + .6 : fade;  // 이전 장이 완전히 덮인 뒤에 새 요소 시작
      to.style.setProperty('--fade', fade + 's');
      to.style.setProperty('--sd', wait + 's');
      slides.forEach(s => s.classList.remove('prev'));
      if (from) from.classList.add('prev');
      to.classList.add('snap'); if (to.dataset.steps) to.dataset.step = k; void to.offsetWidth; to.classList.remove('snap');
      slides.forEach((s, j) => s.classList.toggle('on', j === i));
      clearTimeout(prevTimer);
      prevTimer = setTimeout(() => from && from.classList.remove('prev'), fade * 1000 + 50);
      curSlide = i;
    }
    if (slides[i].dataset.steps) slides[i].dataset.step = k;
    cur = n;
    // 영상은 그 단계가 보이자마자(대지 전환이 끝난 뒤) 처음부터 재생, 벗어나면 정지
    if (entered) slides[i].classList.remove('done', 'playing');
    document.querySelectorAll('video').forEach(v => {
      if (v.hasAttribute('data-chain')) { if (entered || v.closest('.slide') !== slides[i]) { v.pause(); v.currentTime = 0; } return; }  // 앞 영상이 끝나야 재생
      const show = v.closest('.slide') === slides[i] && (v.dataset.step === undefined || k === +v.dataset.step);
      if (show && v.paused && !q.has('static')) {
        v.currentTime = 0;
        setTimeout(() => { if (steps[cur][0] === i) v.play(); }, wait * 1000);
      } else if (!show) v.pause();
    });
    history.replaceState(null, '', '#' + (n + 1));
  }
  // 9장: 왼쪽 반지 영상이 끝나면(제스처) 오른쪽 로봇 화면 UI 재생 → 2초쯤 설명 등장
  const s9L = document.getElementById('s9flick'), s9R = document.getElementById('s9screen');
  s9R.src = /^((?!chrome|android).)*safari/i.test(navigator.userAgent) ? 'assets/s9-screen.mov' : 'assets/s9-screen.webm';  // 투명 영상: 사파리는 HEVC, 그 외 VP9
  s9L.addEventListener('ended', () => { if (s9L.closest('.slide').classList.contains('on')) { s9R.currentTime = 0; s9R.play(); } });
  s9R.addEventListener('playing', () => s9R.closest('.slide').classList.add('playing'));  // 영상 시작에 맞춰 푸른 빛 상승
  // 설명은 화면 UI 영상이 2초쯤(푸른 빛이 다 올라왔을 때) 등장, ended 는 대비용
  const s9Done = () => s9R.closest('.slide').classList.add('done');
  s9R.addEventListener('timeupdate', () => { if (s9R.currentTime >= 2) s9Done(); });
  s9R.addEventListener('ended', s9Done);
  // data-replay="초": 끝나면 그만큼 쉬었다가 처음부터 다시 (그 장에 있을 때만)
  document.querySelectorAll('video[data-replay]').forEach(v => v.addEventListener('ended', () => setTimeout(() => {
    if (v.closest('.slide').classList.contains('on') && v.ended) { v.currentTime = 0; v.play(); }
  }, v.dataset.replay * 1000)));
  go(q.has('static') ? (parseInt(location.hash.slice(1)) || 1) - 1 : 0);

  addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) go(cur + 1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) go(cur - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(steps.length - 1);
    else if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else return;
    e.preventDefault();
  });
  // 화면 왼쪽 1/4 클릭 = 이전, 나머지 = 다음
  addEventListener('click', e => go(cur + (e.clientX < innerWidth / 4 ? -1 : 1)));
</script>
